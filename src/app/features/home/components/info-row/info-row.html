<div class="info-row mc-inset">
  <div class="info-icon" aria-hidden="true">
    @switch (icon()) {
      @case ('map-pin') {
        <svg viewBox="0 0 24 24"><path d="M12 21s7-5.2 7-12a7 7 0 0 0-14 0c0 6.8 7 12 7 12z" /><circle cx="12" cy="9" r="2.5" /></svg>
      }
      @case ('calendar') {
        <svg viewBox="0 0 24 24"><path d="M8 2v4M16 2v4M4 10h16M5 5h14v16H5z" /></svg>
      }
      @case ('pizza') {
        <svg viewBox="0 0 24 24"><path d="M4 20 20 4c-4-2-10-1-13 2s-5 9-3 14z" /><path d="M9 15h.01M13 11h.01M8 8c3 1 5 3 8 8" /></svg>
      }
      @case ('heart') {
        <svg viewBox="0 0 24 24"><path d="M20.8 5.6a5.2 5.2 0 0 0-7.4 0L12 7l-1.4-1.4a5.2 5.2 0 1 0-7.4 7.4L12 21l8.8-8a5.2 5.2 0 0 0 0-7.4z" /></svg>
      }
    }
  </div>

  <div class="info-content">
    <p class="info-label">{{ label() }}</p>
    <p class="info-value">{{ value() }}</p>
  </div>
</div>
